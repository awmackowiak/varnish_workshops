<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif" font-size="17">
  <title id="title">Simplified HIT, MISS and pass request flow</title>
  <desc id="desc">vcl_recv chooses lookup via vcl_hash or pass via vcl_pass. A fresh HIT goes through vcl_hit to vcl_deliver without a backend request. MISS goes through vcl_miss to vcl_backend_fetch and vcl_backend_response, storing only if cacheable. Pass goes directly to the backend and does not store a reusable response. Both fetch branches then deliver to the client. Grace, errors and restarts are omitted.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
  <g fill="#e8f0fe" stroke="#1a73e8" stroke-width="2">
    <rect x="20" y="35" width="125" height="55" rx="8"/>
    <rect x="205" y="35" width="185" height="55" rx="8"/>
    <rect x="475" y="35" width="140" height="55" rx="8"/>
    <rect x="825" y="35" width="155" height="55" rx="8"/>
    <rect x="475" y="145" width="140" height="55" rx="8"/>
    <rect x="205" y="255" width="140" height="55" rx="8"/>
  </g>
  <g fill="#fff4e5" stroke="#f29900" stroke-width="2">
    <rect x="435" y="255" width="190" height="55" rx="8"/>
    <rect x="705" y="255" width="275" height="55" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="82" y="69">vcl_recv</text>
    <text x="297" y="69">vcl_hash / lookup</text>
    <text x="545" y="69">vcl_hit</text>
    <text x="902" y="69">vcl_deliver</text>
    <text x="545" y="179">vcl_miss</text>
    <text x="275" y="289">vcl_pass</text>
    <text x="530" y="289">vcl_backend_fetch</text>
    <text x="842" y="289">vcl_backend_response</text>
    <text x="433" y="24" font-size="15">fresh HIT</text>
    <text x="688" y="52" font-size="15">no backend</text>
    <text x="425" y="129" font-size="15">MISS</text>
    <text x="98" y="206" font-size="15">pass</text>
    <text x="665" y="244" font-size="15">backend</text>
    <text x="842" y="339" font-size="15">MISS: store only if cacheable</text>
    <text x="842" y="360" font-size="15">pass: no reusable response stored</text>
  </g>
  <g fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)">
    <path d="M145 62 H203"/>
    <path d="M390 62 H473"/>
    <path d="M615 62 H823"/>
    <path d="M297 90 V172 H473"/>
    <path d="M545 200 V253"/>
    <path d="M82 90 V282 H203"/>
    <path d="M345 282 H433"/>
    <path d="M625 282 H703"/>
    <path d="M902 255 V92"/>
  </g>
  <text x="500" y="398" text-anchor="middle" font-size="16" fill="#555">Blue: client-side hooks (req / resp). Orange: backend hooks (bereq / beresp). Grace and errors omitted.</text>
</svg>
