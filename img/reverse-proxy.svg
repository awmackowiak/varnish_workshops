<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif" font-size="18">
  <title id="title">Varnish lab reverse proxy and port mappings</title>
  <desc id="desc">HTTP clients use localhost:8081, mapped to Varnish container port 6081. Fresh HITs return from the lab memory cache. MISS and pass contact backend1:8080 or backend2:8080 inside the compose network. Direct host access uses localhost:8091 and localhost:8092. Backend2 and the director are added in exercise 7.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
  <rect x="340" y="20" width="640" height="330" rx="12" fill="#fafafa" stroke="#999" stroke-dasharray="6 4"/>
  <text x="360" y="48" font-size="16" fill="#555">Compose network: use container names and ports</text>
  <rect x="20" y="125" width="160" height="105" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="100" y="163" text-anchor="middle" font-weight="bold">HTTP client</text>
  <text x="100" y="192" text-anchor="middle" font-size="16">curl / browser</text>
  <rect x="365" y="95" width="230" height="180" rx="10" fill="#fff4e5" stroke="#f29900" stroke-width="2"/>
  <text x="480" y="131" text-anchor="middle" font-weight="bold">Varnish Cache</text>
  <text x="480" y="160" text-anchor="middle" font-size="16">container varnish:6081</text>
  <rect x="390" y="184" width="180" height="64" rx="6" fill="#fff" stroke="#f29900"/>
  <text x="480" y="210" text-anchor="middle" font-size="16">Object store</text>
  <text x="480" y="232" text-anchor="middle" font-size="16">lab: malloc / RAM</text>
  <rect x="785" y="75" width="175" height="100" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="872" y="108" text-anchor="middle" font-weight="bold">backend1</text>
  <text x="872" y="136" text-anchor="middle" font-size="16">backend1:8080</text>
  <text x="872" y="158" text-anchor="middle" font-size="15">host localhost:8091</text>
  <rect x="785" y="225" width="175" height="100" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="872" y="258" text-anchor="middle" font-weight="bold">backend2 (Ex7)</text>
  <text x="872" y="286" text-anchor="middle" font-size="16">backend2:8080</text>
  <text x="872" y="308" text-anchor="middle" font-size="15">host localhost:8092</text>
  <g fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)">
    <path d="M180 153 H363"/>
    <path d="M365 216 H182"/>
    <path d="M595 135 H783"/>
    <path d="M595 235 H690 V270 H783"/>
  </g>
  <text x="270" y="112" text-anchor="middle" font-size="16">localhost:8081</text>
  <text x="270" y="135" text-anchor="middle" font-size="16">maps to :6081</text>
  <text x="270" y="242" text-anchor="middle" font-size="16">HTTP response</text>
  <text x="690" y="173" text-anchor="middle" font-size="17" font-weight="bold">MISS or pass</text>
  <text x="690" y="196" text-anchor="middle" font-size="15">fetch from backend</text>
  <text x="480" y="305" text-anchor="middle" font-size="16">HIT: no backend request</text>
  <text x="500" y="377" text-anchor="middle" font-size="16" fill="#555">Direct host ports are for lab comparison and health controls; normal traffic uses Varnish.</text>
</svg>
