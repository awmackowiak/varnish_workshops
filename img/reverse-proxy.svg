<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Helvetica, Arial, sans-serif" font-size="16">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker>
  </defs>
  <rect x="20" y="130" width="140" height="80" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="90" y="165" text-anchor="middle" font-weight="bold">Clients</text>
  <text x="90" y="188" text-anchor="middle" font-size="13">browser / API</text>

  <rect x="330" y="100" width="200" height="140" rx="10" fill="#fff4e5" stroke="#f29900" stroke-width="2"/>
  <text x="430" y="135" text-anchor="middle" font-weight="bold">Varnish Cache</text>
  <text x="430" y="160" text-anchor="middle" font-size="13">reverse proxy + cache</text>
  <rect x="360" y="178" width="140" height="42" rx="6" fill="#fff" stroke="#f29900"/>
  <text x="430" y="204" text-anchor="middle" font-size="13">object store (RAM)</text>

  <rect x="720" y="40" width="160" height="80" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="800" y="75" text-anchor="middle" font-weight="bold">backend1</text>
  <text x="800" y="98" text-anchor="middle" font-size="13">app server</text>
  <rect x="720" y="220" width="160" height="80" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="800" y="255" text-anchor="middle" font-weight="bold">backend2</text>
  <text x="800" y="278" text-anchor="middle" font-size="13">app server</text>

  <line x1="160" y1="160" x2="328" y2="160" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="244" y="150" text-anchor="middle" font-size="13">1. request</text>
  <line x1="328" y1="190" x2="162" y2="190" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="244" y="212" text-anchor="middle" font-size="13">HIT: answered from cache</text>

  <line x1="530" y1="140" x2="718" y2="90" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="530" y1="200" x2="718" y2="250" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="640" y="170" text-anchor="middle" font-size="13">2. MISS: fetch</text>
  <text x="640" y="188" text-anchor="middle" font-size="13">(director picks backend)</text>

  <text x="450" y="335" text-anchor="middle" font-size="14" fill="#555">Clients only ever talk to Varnish; backends are hidden behind it.</text>
</svg>
